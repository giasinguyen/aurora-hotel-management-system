services:

  # ============================================================
  # PostgreSQL (pgvector)
  # ============================================================
  aurora-postgres:
    image: pgvector/pgvector:pg16
    container_name: aurora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: aurora_hotel
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d aurora_hotel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurora-network

  # ============================================================
  # Redis
  # ============================================================
  aurora-redis:
    image: redis:7.2-alpine
    container_name: aurora-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - aurora-network

  # ============================================================
  # Spring Boot Backend
  # ============================================================
  aurora-backend:
    build:
      context: ./aurora-backend
      dockerfile: Dockerfile
    container_name: aurora-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override localhost values from .env to use Docker service names
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://aurora-postgres:5432/aurora_hotel
      REDIS_HOST: aurora-redis
    depends_on:
      aurora-postgres:
        condition: service_healthy
      aurora-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - aurora-network

  # ============================================================
  # React Frontend (Nginx)
  # ============================================================
  aurora-frontend:
    build:
      context: ./aurora-frontend
      dockerfile: Dockerfile
    container_name: aurora-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:${FRONTEND_PORT:-80}"
    environment:
      PORT: ${FRONTEND_PORT:-80}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-aurora_hotel}
    depends_on:
      aurora-backend:
        condition: service_healthy
    networks:
      - aurora-network

volumes:
  pg_data:
  redis_data:

networks:
  aurora-network:
    driver: bridge

# =============================================================================
# QUICK START (Ubuntu / EC2)
# =============================================================================
# 1. cp .env.example .env
# 2. Điền các giá trị trong .env (đặc biệt: EC2_PUBLIC_IP, API keys)
# 3. docker compose up -d --build
# 4. Sau lần đầu chạy, seed dữ liệu mẫu:
#    docker exec -i aurora-postgres psql -U admin -d aurora_hotel \
#      < aurora-backend/src/main/resources/db/init-db-pg-admin.sql
# =============================================================================
